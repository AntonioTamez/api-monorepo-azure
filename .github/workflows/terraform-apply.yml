# Workflow: aplicar la infraestructura aprobada.
# Se ejecuta al fusionar a master un cambio que toca infra/**. Primero dev; despues prod
# (que queda en pausa hasta que un revisor lo apruebe, por el environment "prod").
# Explicacion: docs/11-cd-y-ambientes.md
#
# Recuerda: el plan que reviso la persona esta en el comentario del pull request. Aqui se
# genera un plan nuevo justo antes de aplicar; si el estado de Azure cambio entre medias,
# puede diferir un poco. Mira siempre el log del paso "Terraform plan" antes de aprobar prod.

name: Terraform apply

on:
  push:
    branches: [master]
    paths:
      - "infra/**"
  # Para reaplicar a mano (por ejemplo, tras arreglar un error transitorio).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Dos apply a la vez sobre el mismo state se pisarian (Terraform lo bloquea ademas con
# un lock). Hacemos cola y NUNCA cancelamos uno en curso: cortar un apply a mitad puede
# dejar recursos a medio crear.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  apply:
    name: Apply ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # Si dev falla, prod no se toca.
      fail-fast: true
      # Uno detras de otro, en orden: dev y luego prod.
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(vars.ENABLE_PROD == 'true' && '["dev","prod"]' || '["dev"]') }}

    # Para "prod" el job espera aprobacion manual (required reviewers del environment).
    # Tambien define el subject OIDC: repo:OWNER/REPO:environment:<nombre>.
    environment: ${{ matrix.environment }}

    defaults:
      run:
        shell: bash
        working-directory: infra/envs/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate"

      - name: Terraform validate
        run: terraform validate -no-color

      # Guardamos el plan en un fichero: "apply" ejecutara EXACTAMENTE ese plan.
      - name: Terraform plan
        run: terraform plan -no-color -lock-timeout=120s -out=tfplan

      - name: Terraform apply
        run: terraform apply -no-color -lock-timeout=120s tfplan
