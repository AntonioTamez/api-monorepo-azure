# Dependabot abre pull requests automaticos cuando hay versiones nuevas
# (o parches de seguridad) de las dependencias. Se revisan como cualquier PR.
version: 2

updates:
  # Paquetes NuGet de los proyectos .NET.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Versiones de las acciones usadas en .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imagenes base del Dockerfile (sdk y aspnet).
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
